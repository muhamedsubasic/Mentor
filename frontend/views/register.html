<!-- Register Section -->
<section class="section">
  <div class="container" data-aos="fade-up">
    <div class="row justify-content-center">
      <div class="col-lg-6 col-md-8">
        
        <div class="auth-card">
          <div class="text-center mb-4">
            <h2>Create an Account</h2>
            <p class="text-muted">Join Mentor and start learning today</p>
          </div>

          <form class="php-email-form">
            <div class="row mb-3">
              <div class="col-md-6">
                <label class="form-label">First Name</label>
                <input type="text" class="form-control" required placeholder="John">
              </div>
              <div class="col-md-6 mt-3 mt-md-0">
                <label class="form-label">Last Name</label>
                <input type="text" class="form-control" required placeholder="Doe">
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">Email address</label>
              <input type="email" class="form-control" required placeholder="name@example.com">
            </div>
            
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" class="form-control" required placeholder="••••••••">
            </div>

            <div class="mb-4">
              <label class="form-label">Confirm Password</label>
              <input type="password" class="form-control" required placeholder="••••••••">
            </div>

            <div class="form-check mb-4">
              <input class="form-check-input" type="checkbox" id="termsCheck" required>
              <label class="form-check-label" for="termsCheck">
                I agree to the <a href="#" style="color: var(--accent-color);">Terms of Service</a>
              </label>
            </div>

            <button type="submit" class="btn-submit">Register</button>
          </form>

          <div class="text-center mt-4">
            <p class="mb-0">Already have an account? <a href="#login" class="fw-bold" style="color: var(--accent-color);">Log in here</a></p>
          </div>
        </div>

      </div>
    </div>
  </div>
</section>
