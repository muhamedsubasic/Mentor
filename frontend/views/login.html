<!-- Login Section -->
<section class="section">
  <div class="container" data-aos="fade-up">
    <div class="row justify-content-center">
      <div class="col-lg-5 col-md-8">
        
        <div class="auth-card">
          <div class="text-center mb-4">
            <h2>Welcome Back</h2>
            <p class="text-muted">Log in to continue to Mentor</p>
          </div>

          <form class="php-email-form">
            <div class="mb-3">
              <label class="form-label">Email address</label>
              <input type="email" class="form-control" required placeholder="name@example.com">
            </div>
            
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" class="form-control" required placeholder="••••••••">
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="rememberMe">
                <label class="form-check-label" for="rememberMe">Remember me</label>
              </div>
              <a href="#" class="text-decoration-none" style="color: var(--accent-color);">Forgot password?</a>
            </div>

            <button type="submit" class="btn-submit">Log In</button>
          </form>

          <div class="text-center mt-4">
            <p class="mb-0">Don't have an account? <a href="#register" class="fw-bold" style="color: var(--accent-color);">Register here</a></p>
          </div>
        </div>

      </div>
    </div>
  </div>
</section>
